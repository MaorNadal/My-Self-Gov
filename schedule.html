<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח זמן - ממשל אישי</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Rubik', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
    <script src="gov-core.js?v=0.7.0"></script>
    <script src="gov-nav.js?v=0.7.0"></script>
    <header class="max-w-6xl mx-auto px-4 pt-6 pb-2 text-center">
        <h1 class="text-3xl font-black text-white">🗓️ לוח זמן ממשלתי</h1>
        <p class="text-slate-400 text-sm mt-1 max-w-2xl mx-auto">יומן ניצול זמן: מה עשית ומתי, לאיזה תיק, הבטחה או משימה זה שייך. אי אפשר לרשום שני דברים באותה שעה, ואי אפשר לרשום זמן עתידי. בנוסף: פגישות ואירועים.</p>
    </header>
    <main class="max-w-6xl mx-auto px-4 space-y-5 mt-4">
        <section id="sch-today" class="g-card space-y-3"></section>
        <section id="sch-pie" class="g-card"></section>
        <section id="sch-events" class="g-card space-y-3"></section>
    </main>
    <script>
        const G = window.GOV, h = G.esc, $ = id => document.getElementById(id), NOW = G.localDate();
        let day = NOW, range = 'week';
        const PAL = ['#38bdf8', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#fb923c', '#2dd4bf', '#f472b6', '#a3e635', '#818cf8', '#94a3b8'];
        const pList = () => G.portfolios.all(), colorOf = pid => { const i = pList().findIndex(p => p.id === pid); return i < 0 ? '#64748b' : PAL[i % 10]; };
        const nameOf = pid => { const p = G.portfolios.get(pid); return p ? p.icon + ' ' + p.name : '❔ ללא תיק'; };
        const fmt = m => { const hh = Math.floor(m / 60), mm = m % 60; return (hh ? hh + ' ש׳ ' : '') + (mm || !hh ? mm + ' ד׳' : ''); };
        const pOpts = s => '<option value="">ללא תיק</option>' + pList().map(p => `<option value="${h(p.id)}"${p.id === s ? ' selected' : ''}>${p.icon} ${h(p.name)}</option>`).join('');

        function renderToday() {
            const L = G.timelog.on(day), tot = L.reduce((a, x) => a + x.mins, 0), evs = G.events.on(day);
            const ts = G.tasks.all().filter(t => !t.done), ps = G.promises.all().filter(p => p.month === G.monthOf(day) && p.status !== 'dropped');
            // ציר 24 שעות: פס אופקי; כל קטע = רישום, כל פגישה = סימון עליון
            const X = m => (m / 1440 * 100).toFixed(2);
            const bar = `<svg viewBox="0 0 100 14" preserveAspectRatio="none" style="width:100%;height:3.2rem;background:#0f172a;border-radius:8px"><title>ציר 24 שעות</title>${[0, 6, 12, 18, 24].map(hr => `<line x1="${X(hr * 60)}" x2="${X(hr * 60)}" y1="0" y2="14" stroke="#1e293b" stroke-width=".3"/>`).join('')}
                ${L.map(x => { const a = Number(x.start.slice(0, 2)) * 60 + Number(x.start.slice(3)); return `<rect x="${X(a)}" y="4" width="${Math.max(.4, x.mins / 14.4).toFixed(2)}" height="10" fill="${colorOf(x.pid)}" opacity=".9"><title>${h(x.start)}-${h(x.end)} ${h(x.text)}</title></rect>`; }).join('')}
                ${evs.filter(e => e.start).map(e => { const a = Number(e.start.slice(0, 2)) * 60 + Number(e.start.slice(3)); return `<rect x="${X(a)}" y="0" width="${Math.max(.6, (e.end ? (Number(e.end.slice(0, 2)) * 60 + Number(e.end.slice(3)) - a) : 20) / 14.4).toFixed(2)}" height="3" fill="#e2e8f0"><title>פגישה: ${h(e.title)}</title></rect>`; }).join('')}</svg>
                <div class="flex justify-between text-[9px] text-slate-500 px-1" dir="ltr"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>`;
            $('sch-today').innerHTML = `<div class="flex flex-wrap items-center justify-between gap-2"><h2 class="font-bold text-white text-sm">⏱️ יומן הזמן של היום</h2>
                <div class="flex items-center gap-2"><button class="g-btn" onclick="day=G.addDays(day,-1);render()">→</button><input type="date" class="g-inp" style="margin:0;width:auto" value="${day}" max="${NOW}" onchange="day=this.value||NOW;render()"><button class="g-btn" onclick="if(day<NOW){day=G.addDays(day,1);render()}">←</button></div></div>
                ${bar}<div class="text-[11px] text-slate-400">נרשמו ${fmt(tot)} מתוך 24 שעות (${Math.round(tot / 14.4)}%). ${tot ? '' : 'אין רישומים ליום הזה.'}</div>
                <div class="space-y-1">${L.map(x => `<div class="flex items-center gap-2 text-xs bg-slate-900/70 border border-slate-700 rounded-lg px-3 py-1.5" style="border-right:4px solid ${x.issueId ? '#f43f5e' : colorOf(x.pid)}"><span class="text-slate-400 w-24 shrink-0" dir="ltr">${h(x.start)}–${h(x.end)}</span><span class="flex-1">${h(x.text)} <span class="text-slate-500">${x.issueId && G.issues.get(x.issueId) ? '<span class="text-rose-300">🚫 ' + h(G.issues.get(x.issueId).title) + '</span> • ' : ''}${h(nameOf(x.pid))}${x.promiseId && G.promises.get(x.promiseId) ? ' • 📜' : ''}${x.taskId && G.tasks.get(x.taskId) ? ' • ☑️' : ''}</span></span><span class="text-slate-300">${fmt(x.mins)}</span><button class="text-rose-400" onclick="delLog('${h(x.id)}')">✕</button></div>`).join('')}</div>
                <div class="rounded-xl border border-dashed border-slate-600 p-3"><div class="text-[11px] font-bold text-slate-300 mb-2">➕ רישום זמן</div>
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-2 items-end">
                        <label class="g-lab">התחלה<input id="lS" type="time" class="g-inp"></label><label class="g-lab">סיום<input id="lE" type="time" class="g-inp"></label>
                        <label class="g-lab col-span-2 md:col-span-2">מה עשית?<input id="lT" class="g-inp" maxlength="140"></label><label class="g-lab">תיק<select id="lP" class="g-inp">${pOpts('')}</select></label>
                        <button class="g-btn pri" onclick="addLog()">הוסף</button>
                        <label class="g-lab md:col-span-3">הבטחה (אופציונלי)<select id="lPr" class="g-inp"><option value="">—</option>${ps.map(p => `<option value="${h(p.id)}">${h(p.text.slice(0, 50))}</option>`).join('')}</select></label>
                        <label class="g-lab md:col-span-3">משימה (אופציונלי)<select id="lTk" class="g-inp"><option value="">—</option>${ts.map(t => `<option value="${h(t.id)}">${h(t.text.slice(0, 50))}</option>`).join('')}</select></label>
                        <label class="g-lab md:col-span-6" style="color:#fda4af">🚫 זו הסחת דעת / פעולה פסולה שיש למגר? (מסמן אותה כנגד סוגיה)<select id="lDis" class="g-inp"><option value="">לא, זה זמן רגיל</option>${G.issues.all().filter(i => i.kind === 'distraction' && i.status !== 'resolved').map(i => `<option value="${h(i.id)}">${h(i.title)}</option>`).join('')}<option value="__new">➕ הסחה חדשה…</option></select></label></div></div>`;
        }
        function addLog() {
            const pr = G.promises.get($('lPr').value), tk = G.tasks.get($('lTk').value); let dis = $('lDis').value;
            if (dis === '__new') { const nm = (prompt('שם ההסחה / הפעולה הפסולה (למשל: גלילה ברשתות)') || '').trim(); if (nm.length < 3) return; const ni = G.issues.save({ title: nm, kind: 'distraction', severity: 2 }); dis = ni ? ni.id : ''; }
            const r = G.timelog.add({ date: day, start: $('lS').value, end: $('lE').value, text: $('lT').value, pid: $('lP').value || (tk && tk.pid) || (pr && pr.pid) || '', promiseId: $('lPr').value || (tk && tk.promiseId) || '', taskId: $('lTk').value, issueId: dis });
            if (!r.ok) { alert(r.error); return; } render();
        }
        function delLog(id) { if (confirm('למחוק את הרישום?')) { G.timelog.remove(id); render(); } }

        function rangeDays() { const n = range === 'day' ? 1 : range === 'week' ? 7 : 30, to = day, from = G.addDays(to, -(n - 1)); return { from, to, n }; }
        function renderPie() {
            const { from, to, n } = rangeDays(), m = G.timelog.byPortfolio(from, to), rows = Object.entries(m).map(([pid, v]) => ({ pid, v })).sort((a, b) => b.v - a.v), tot = rows.reduce((a, r) => a + r.v, 0), R = 52, C = 2 * Math.PI * R;
            let acc = 0; const segs = rows.map(r => { const d = r.v / tot * C, el = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${colorOf(r.pid)}" stroke-width="30" stroke-dasharray="${d.toFixed(2)} ${(C - d).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 70 70)"><title>${h(nameOf(r.pid))}: ${fmt(r.v)} (${Math.round(r.v / tot * 100)}%)</title></circle>`; acc += d; return el; }).join('');
            // עמודות יומיות מוערמות
            const days = []; for (let i = 0; i < n; i++) days.push(G.addDays(from, i));
            const per = days.map(d => G.timelog.on(d)), mx = Math.max(60, ...per.map(l => l.reduce((a, x) => a + x.mins, 0))), BW = 100 / days.length;
            const stack = n > 1 ? `<svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:9rem;background:#0f172a;border-radius:10px">${per.map((l, i) => { let y = 40; return l.sort((a, b) => a.start.localeCompare(b.start)).map(x => { const hh = x.mins / mx * 36; y -= hh; return `<rect x="${(i * BW + BW * .15).toFixed(2)}" y="${y.toFixed(2)}" width="${(BW * .7).toFixed(2)}" height="${hh.toFixed(2)}" fill="${colorOf(x.pid)}"><title>${h(days[i])} ${h(x.text)} ${fmt(x.mins)}</title></rect>`; }).join(''); }).join('')}</svg><div class="flex justify-between text-[9px] text-slate-500" dir="ltr"><span>${h(from.slice(5))}</span><span>${h(to.slice(5))}</span></div>` : '';
            $('sch-pie').innerHTML = `<div class="flex flex-wrap items-center justify-between gap-2 mb-3"><h2 class="font-bold text-white text-sm">🥧 חלוקת הזמן לפי תיקים</h2><div class="flex gap-1">${[['day', 'יום'], ['week', '7 ימים'], ['month', '30 ימים']].map(([k, l]) => `<button class="g-btn ${range === k ? 'pri' : ''}" onclick="range='${k}';renderPie()">${l}</button>`).join('')}</div></div>` +
                (tot ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center"><div class="flex items-center gap-4 flex-wrap"><svg viewBox="0 0 140 140" style="width:11rem;height:11rem"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#0f172a" stroke-width="30"/>${segs}<text x="70" y="68" text-anchor="middle" font-size="17" font-weight="900" fill="#f8fafc">${Math.floor(tot / 60)} ש׳</text><text x="70" y="84" text-anchor="middle" font-size="8" fill="#94a3b8">${n === 1 ? 'ביום' : 'ב-' + n + ' ימים'}</text></svg>
                    <div class="space-y-1 text-xs">${rows.map(r => `<div class="flex items-center gap-2"><i class="inline-block w-3 h-3 rounded" style="background:${colorOf(r.pid)}"></i><span class="text-slate-200">${h(nameOf(r.pid))}</span><span class="text-slate-400">${fmt(r.v)} • ${Math.round(r.v / tot * 100)}%</span></div>`).join('')}</div></div>
                    <div>${stack}<p class="text-[10px] text-slate-500 mt-2">${n > 1 ? 'כל עמודה היא יום, וכל צבע הוא תיק.' : ''} הנתונים הם רק מה שרשמת: זמן שלא נרשם לא נספר.</p></div></div>` : '<p class="text-xs text-slate-500 text-center py-6">אין רישומי זמן בטווח הזה.</p>') + distHtml(from, to, tot);
        }

        function distHtml(from, to, tot) {
            const d = G.timelog.distractions(from, to), rows = Object.entries(d).sort((a, b) => b[1].mins - a[1].mins), sum = rows.reduce((a, [, r]) => a + r.mins, 0);
            if (!rows.length) return '<div class="mt-4 text-[11px] text-slate-500">🚫 לא נרשמו הסחות בטווח הזה. אפשר לסמן רישום זמן כהסחת דעת או פעולה פסולה ולמגר אותה בדף הסוגיות.</div>';
            return `<div class="mt-4 rounded-xl border border-rose-500/40 bg-rose-500/5 p-3"><div class="text-xs font-bold text-rose-300 mb-2">🚫 הסחות ופעולות פסולות בטווח: ${fmt(sum)}${tot ? ' (' + Math.round(sum / tot * 100) + '% מהזמן שנרשם)' : ''}</div>${rows.map(([id, r]) => { const i = G.issues.get(id); return `<a href="issues.html#i=${h(id)}" class="flex justify-between text-xs py-0.5 hover:text-amber-300"><span>${h(i ? i.title : 'הסחה שנמחקה')}</span><span class="text-slate-400">${fmt(r.mins)} • ${r.n} פעמים</span></a>`; }).join('')}</div>`;
        }
        function renderEvents() {
            const up = G.events.upcoming(G.addDays(NOW, -2), G.addDays(NOW, 60)), ppl = G.people.all().filter(p => !p.archived);
            $('sch-events').innerHTML = `<h2 class="font-bold text-white text-sm">🤝 פגישות ואירועים</h2>
                <div class="grid grid-cols-2 md:grid-cols-6 gap-2 items-end"><label class="g-lab col-span-2 md:col-span-2">כותרת<input id="eT" class="g-inp" maxlength="140"></label><label class="g-lab">תאריך<input id="eD" type="date" class="g-inp" value="${NOW}"></label><label class="g-lab">התחלה<input id="eS" type="time" class="g-inp"></label><label class="g-lab">סיום<input id="eE" type="time" class="g-inp"></label><label class="g-lab">מקום<input id="eP" class="g-inp" maxlength="100"></label>
                    <label class="g-lab md:col-span-2">תיק<select id="ePid" class="g-inp">${pOpts('')}</select></label><label class="g-lab md:col-span-2">אדם (מיומן היחסים)<select id="ePer" class="g-inp"><option value="">—</option>${ppl.map(p => `<option value="${h(p.id)}">${h(p.name)}</option>`).join('')}</select></label><button class="g-btn pri md:col-span-2" onclick="addEvent()">➕ הוסף אירוע</button></div>
                <div class="space-y-1">${up.map(e => { const past = e.date < NOW, per = e.personId && G.people.get(e.personId); return `<div class="flex items-center gap-2 text-xs bg-slate-900/70 border border-slate-700 rounded-lg px-3 py-1.5" style="border-right:4px solid ${e.done ? '#34d399' : past ? '#f87171' : '#38bdf8'}"><input type="checkbox" ${e.done ? 'checked' : ''} onchange="doneEv('${h(e.id)}')" class="accent-emerald-400" title="התקיים"><span class="w-28 shrink-0 text-slate-400">${e.date === NOW ? 'היום' : h(e.date.slice(5))} ${h(e.start)}${e.end ? '–' + h(e.end) : ''}</span><span class="flex-1 ${e.done ? 'line-through text-slate-500' : ''}">${h(e.title)}${e.place ? ' 📍' + h(e.place) : ''}${per ? ' 👤 ' + h(per.name) : ''} <span class="text-slate-500">${e.pid ? h(nameOf(e.pid)) : ''}</span></span>${past && !e.done ? '<span class="text-rose-300">לא סומן כמתקיים</span>' : ''}<button class="text-rose-400" onclick="delEv('${h(e.id)}')">✕</button></div>`; }).join('') || '<p class="text-xs text-slate-500">אין אירועים קרובים.</p>'}</div>`;
        }
        function addEvent() { const t = $('eT').value.trim(); if (t.length < 2) { alert('הזן כותרת (לפחות 2 תווים).'); return; } if (!$('eD').value) { alert('הזן תאריך.'); return; }
            const s = $('eS').value, e = $('eE').value; if (e && (!s || e <= s)) { alert('שעת סיום חייבת להיות אחרי שעת ההתחלה.'); return; }
            G.events.save({ title: t, date: $('eD').value, start: s, end: e, place: $('eP').value, pid: $('ePid').value, personId: $('ePer').value }); render(); }
        function doneEv(id) { const e = G.events.get(id); if (e) { e.done = !e.done; G.events.save(e); if (e.done && e.personId && G.people.get(e.personId) && confirm('לרשום את הפגישה ביומן היחסים של ' + G.people.get(e.personId).name + '?')) G.relEvents.save({ personId: e.personId, date: e.date > NOW ? NOW : e.date, text: 'פגישה: ' + e.title, impact: 1 }); } render(); }
        function delEv(id) { if (confirm('למחוק את האירוע?')) { G.events.remove(id); render(); } }
        function render() { renderToday(); renderPie(); renderEvents(); }
        window.addEventListener('DOMContentLoaded', render); window.addEventListener('storage', render);
    </script>
</body>
</html>
