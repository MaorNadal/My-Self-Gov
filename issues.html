<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוגיות - ממשל אישי</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Rubik', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
    <script src="gov-core.js?v=0.6.1"></script>
    <script src="gov-nav.js?v=0.6.1"></script>
    <header class="max-w-6xl mx-auto px-4 pt-6 pb-2 text-center">
        <h1 class="text-3xl font-black text-white">🔥 סוגיות על הפרק</h1>
        <p class="text-slate-400 text-sm mt-1 max-w-2xl mx-auto">סוגיה עולה על הפרק, מסומנת לפי חומרה, מקושרת להבטחות ולמשימות שמטפלות בה, ונסגרת רק בתיעוד מה טופל ואיך, ורק אחרי שהמשימות המקושרות הושלמו.</p>
    </header>
    <main class="max-w-6xl mx-auto px-4 mt-4 grid grid-cols-1 lg:grid-cols-5 gap-4">
        <section id="iss-list" class="lg:col-span-2 space-y-3">
            <div class="g-card"><h2 class="font-bold text-white text-sm mb-2">➕ סוגיה חדשה</h2>
                <input id="nTitle" class="g-inp" maxlength="200" placeholder="מה הסוגיה?">
                <div class="grid grid-cols-2 gap-2 mt-2"><select id="nSev" class="g-inp" style="margin:0"><option value="3">🔴 חמורה</option><option value="2" selected>🟠 רגילה</option><option value="1">🟡 קלה</option></select><select id="nPid" class="g-inp" style="margin:0"></select>
                    <select id="nKind" class="g-inp" style="margin:0"><option value="issue">🔥 סוגיה לטיפול</option><option value="distraction">🚫 פעולה פסולה / הסחת דעת למיגור</option></select>
                    <select id="nHor" class="g-inp" style="margin:0" onchange="$('nTarget').style.display=this.value==='date'?'':'none'">${Object.entries(G.HORIZON).map(([k, l]) => `<option value="${k}">טווח: ${l}</option>`).join('')}</select><input id="nTarget" type="date" class="g-inp" style="margin:0;display:none" title="תאריך יעד"></div>
                <button class="g-btn pri mt-2" onclick="addIssue()">הוסף</button></div>
            <div id="list" class="space-y-1.5"></div>
        </section>
        <section id="iss-detail" class="lg:col-span-3"></section>
    </main>
    <script>
        const G = window.GOV, h = G.esc, $ = id => document.getElementById(id), NOW = G.localDate(), MK = G.monthOf(NOW);
        let sel = (location.hash.match(/^#i=(.+)$/) || [])[1] || null, showResolved = false;
        const sevI = { 3: '🔴', 2: '🟠', 1: '🟡' };
        const pOpts = s => '<option value="">ללא תיק</option>' + G.portfolios.all().map(p => `<option value="${h(p.id)}"${p.id === s ? ' selected' : ''}>${p.icon} ${h(p.name)}</option>`).join('');
        function renderList() {
            $('nPid').innerHTML = pOpts('');
            const all = G.issues.all().sort((a, b) => b.severity - a.severity || a.created.localeCompare(b.created)), act = all.filter(i => i.status !== 'resolved' && i.status !== 'dropped'), res = all.filter(i => i.status === 'resolved' || i.status === 'dropped'), ds = G.dropStats();
            const row = i => { const s = G.ISSUE_STATUS[i.status], pg = G.issues.progress(i.id), nT = { length: pg.n }, d = pg.done;
                return `<button type="button" onclick="openI('${h(i.id)}')" class="w-full text-right g-card hover:border-amber-400 transition ${sel === i.id ? 'border-amber-400' : ''}" style="padding:10px"><div class="flex items-center gap-2 text-sm"><span>${i.kind === 'distraction' ? '🚫' : sevI[i.severity]}</span><span class="flex-1 font-bold ${i.status === 'resolved' || i.status === 'dropped' ? 'line-through text-slate-500' : 'text-white'}">${h(i.title)}</span>${i.horizon !== 'month' ? `<span class="g-chip text-violet-300 border-violet-500/40">${G.HORIZON[i.horizon]}</span>` : ''}<span class="g-chip" style="color:${s.c};border-color:${s.c}55">${s.l}</span></div>
                <div class="text-[10px] text-slate-500 mt-1">${(G.portfolios.get(i.pid) || { icon: '📁', name: 'ללא תיק' }).icon} • ${i.promiseIds.length} הבטחות • משימות ${d}/${nT.length}</div></button>`; };
            $('list').innerHTML = (act.map(row).join('') || '<p class="text-xs text-slate-500 text-center">אין סוגיות פתוחות.</p>') + (res.length ? `<button class="text-[11px] text-sky-300 underline" onclick="showResolved=!showResolved;render()">${showResolved ? 'הסתר' : 'הצג'} היסטוריה: נסגרו ובוטלו (${res.length})</button>${showResolved ? res.map(row).join('') : ''}` : '') + (ds.n ? `<div class="text-[10px] text-slate-400 border-t border-slate-700 pt-2 mt-2">⚖️ ביטולים (סוגיות והבטחות): ${ds.n}, הוערכו ${ds.rated}${ds.avg != null ? ', ציון ממוצע ' + ds.avg + '/5 (' + ds.good + ' נכונים, ' + ds.bad + ' שגויים)' : ''}</div>` : '');
        }
        function addIssue() { const t = $('nTitle').value.trim(); if (t.length < 3) { alert('נסח את הסוגיה (לפחות 3 תווים).'); return; } const i = G.issues.save({ title: t, severity: $('nSev').value, pid: $('nPid').value, kind: $('nKind').value, horizon: $('nHor').value, target: $('nTarget').value }); if (!i) { alert('תאריך היעד חייב להיות אחרי היום.'); return; } $('nTitle').value = ''; if (i) openI(i.id); }
        function openI(id) { sel = id; history.replaceState(null, '', '#i=' + id); render(); if (innerWidth < 1024) $('iss-detail').scrollIntoView({ behavior: 'smooth' }); }
        function treeTask(t, ro) { const od = !t.done && t.due && t.due < NOW; return `<div class="flex items-center gap-2 text-xs bg-slate-900/70 border border-slate-700 rounded-lg px-2.5 py-1.5"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="togT('${h(t.id)}')" class="w-4 h-4 accent-emerald-400"><span class="flex-1 ${t.done ? 'line-through text-slate-500' : ''}">${h(t.text)}</span>${t.time ? `<span class="text-sky-300" dir="ltr">${h(t.time)}</span>` : ''}${t.due ? `<span style="color:${od ? '#f87171' : '#94a3b8'}">${h(t.due)}</span>` : ''}</div>`; }
        function renderDetail() {
            const i = sel && G.issues.get(sel), box = $('iss-detail');
            if (!i) { box.innerHTML = '<div class="g-card text-center text-sm text-slate-400">בחר סוגיה כדי לקשר לה הבטחות ומשימות, או הוסף סוגיה חדשה.</div>'; return; }
            const s = G.ISSUE_STATUS[i.status], drp = i.status === 'dropped', ro = i.status === 'resolved' || drp, dis = i.kind === 'distraction', pg = G.issues.progress(i.id);
            const direct = G.tasks.all().filter(t => t.issueId === i.id && !i.promiseIds.includes(t.promiseId)).sort((a, b) => Number(a.done) - Number(b.done));
            const linked = i.promiseIds.map(id => G.promises.get(id)).filter(Boolean);
            const cand = G.promises.all().filter(p => p.status !== 'dropped' && !i.promiseIds.includes(p.id) && p.month >= G.addMonths(MK, -1) && !['done', 'failed'].includes(p.status)).sort((a, b) => b.month.localeCompare(a.month));
            const left = i.target ? Math.round((Date.parse(i.target) - Date.parse(NOW)) / 864e5) : null, span = i.target ? Math.max(1, Math.round((Date.parse(i.target) - Date.parse(i.created)) / 864e5)) : 0, el = i.target ? Math.max(0, Math.min(100, Math.round((Date.parse(NOW) - Date.parse(i.created)) / 864e5 / span * 100))) : 0;
            const d7 = G.timelog.distractions(G.addDays(NOW, -6), NOW)[i.id] || { mins: 0, n: 0 }, d30 = G.timelog.distractions(G.addDays(NOW, -29), NOW)[i.id] || { mins: 0, n: 0 }, lastD = G.timelog.lastDistraction(i.id), clean = lastD ? Math.round((Date.parse(NOW) - Date.parse(lastD)) / 864e5) : null;
            box.innerHTML = `<div class="g-card space-y-4" style="border-right:4px solid ${dis ? '#f43f5e' : s.c}">
                <div class="flex flex-wrap items-center justify-between gap-2"><div class="flex gap-2"><span class="g-chip" style="color:${s.c};border-color:${s.c}55;background:${s.c}1a">${s.l}</span>${dis ? '<span class="g-chip text-rose-300 border-rose-500/40">🚫 הסחה / פעולה פסולה</span>' : ''}<span class="g-chip text-violet-300 border-violet-500/40">${G.HORIZON[i.horizon]}</span></div><span class="text-[11px] text-slate-500">עלתה ${h(i.created)}${i.resolvedAt ? ' • נסגרה ' + h(i.resolvedAt) : ''}</span></div>
                ${i.target && !ro ? `<div><div class="flex justify-between text-[11px] text-slate-400 mb-1"><span>⏳ יעד: ${h(i.target)}</span><span style="color:${left < 0 ? '#f87171' : '#94a3b8'}">${left < 0 ? 'עבר המועד ב-' + (-left) + ' ימים' : 'נותרו ' + left + ' ימים'}</span></div><div class="g-bar"><i style="width:${el}%;background:#a78bfa"></i></div>${pg.pct != null ? `<div class="flex items-center gap-4 my-2">${G.gauge(pg.pct, { size: 76, label: 'משימות' })}${G.gauge(el, { size: 76, color: '#a78bfa', label: 'זמן שחלף' })}</div><div class="flex justify-between text-[11px] text-slate-400 mt-1.5 mb-1"><span>✔️ התקדמות משימות</span><span>${pg.pct}% (זמן שחלף: ${el}%)</span></div><div class="g-bar"><i style="width:${pg.pct}%;background:${pg.pct >= el ? '#34d399' : '#fb923c'}"></i></div>` : ''}<p class="text-[10px] text-slate-500 mt-1">סוגיה ארוכת טווח נספרת בציון הממשלה לפי קצב: התקדמות המשימות מול חלק הזמן שחלף (נדרשות 3 משימות לפחות).</p></div>` : ''}
                ${dis ? `<div class="rounded-xl border border-rose-500/40 bg-rose-500/5 p-3"><div class="text-xs font-bold text-rose-300 mb-2">🚫 כמה זמן זה לקח (מיומן הזמן)</div><div class="grid grid-cols-3 gap-2 text-center"><div><div class="text-xl font-black text-rose-300">${d7.mins}</div><div class="text-[10px] text-slate-400">דקות ב-7 ימים (${d7.n} פעמים)</div></div><div><div class="text-xl font-black text-rose-300">${d30.mins}</div><div class="text-[10px] text-slate-400">דקות ב-30 ימים (${d30.n} פעמים)</div></div><div><div class="text-xl font-black ${clean == null || clean > 6 ? 'text-emerald-300' : 'text-amber-300'}">${clean == null ? '—' : clean}</div><div class="text-[10px] text-slate-400">ימים נקיים מאז ${lastD ? h(lastD) : 'ההגדרה'}</div></div></div><p class="text-[10px] text-slate-500 mt-2">מסמנים בלוח הזמן כל רישום שהוא הסחה או פעולה פסולה ומקשרים אותו לסוגיה הזו.</p></div>` : ''}
                ${ro ? `<h2 class="text-xl font-black text-white">${sevI[i.severity]} ${h(i.title)}</h2>${i.detail ? `<p class="text-sm text-slate-300">${G.nl(i.detail)}</p>` : ''}${drp ? `<div class="text-sm text-violet-200 bg-violet-500/10 border border-violet-500/30 rounded-xl p-3">🚫 בוטלה ב-${h(i.droppedAt)}. נימוק: ${G.nl(i.dropReason)}</div>` : `<div class="text-sm text-emerald-200 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3">✅ ${G.nl(i.note)}</div>`}` :
                `<div class="grid grid-cols-1 md:grid-cols-3 gap-3"><label class="g-lab md:col-span-3">הסוגיה<input id="eT" class="g-inp" maxlength="200" value="${h(i.title)}"></label>
                    <label class="g-lab">חומרה<select id="eS" class="g-inp">${[3, 2, 1].map(n => `<option value="${n}"${i.severity === n ? ' selected' : ''}>${sevI[n]} ${['', 'קלה', 'רגילה', 'חמורה'][n]}</option>`).join('')}</select></label>
                    <label class="g-lab md:col-span-2">תיק<select id="eP" class="g-inp">${pOpts(i.pid)}</select></label>
                    <label class="g-lab">טווח<select id="eH" class="g-inp" onchange="$('eTg').style.display=this.value==='date'?'':'none'">${Object.entries(G.HORIZON).map(([k, l]) => `<option value="${k}"${i.horizon === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
                    <label class="g-lab md:col-span-2" id="eTg" style="${i.horizon === 'date' ? '' : 'display:none'}">תאריך יעד<input id="eTd" type="date" class="g-inp" value="${h(i.target)}" min="${h(i.created)}"></label>
                    <label class="g-lab md:col-span-3">פירוט: מה בדיוק הבעיה, ומה ההשלכות אם לא תטופל?<textarea id="eD" rows="3" maxlength="1500" class="g-inp">${h(i.detail)}</textarea></label></div>
                <div class="flex flex-wrap gap-2"><button class="g-btn pri" onclick="saveI()">💾 שמור</button>${i.status === 'open' ? '<button class="g-btn" onclick="setSt(\'handling\')">▶️ התחלתי לטפל</button>' : '<button class="g-btn" onclick="setSt(\'open\')">⏸️ החזר ל"עומדת על הפרק"</button>'}<button class="g-btn red" onclick="delI()" title="מחיקה היא הדרך היחידה שבה סוגיה לא נשמרת בהיסטוריה">🗑️ מחק (נפתחה בטעות)</button></div>`}
                <div><h3 class="font-bold text-white text-sm mb-2">🌳 היררכיה: סוגיה ← הבטחות ← משימות (${pg.done}/${pg.n} משימות)</h3>
                    <div class="space-y-2">${linked.map(p => { const ts = G.tasks.forPromise(p.id).sort((a, b) => Number(a.done) - Number(b.done)); return `<div class="rounded-xl border border-slate-700 bg-slate-900/40 p-2"><div class="flex items-center gap-2 text-xs"><span>📜</span><span class="flex-1 font-bold text-slate-100">${h(p.text)}</span><span style="color:${G.STATUS[p.status].c}">${G.STATUS[p.status].l} ${p.progress}%</span>${ro ? '' : `<button class="text-rose-400" title="נתק מהסוגיה" onclick="linkP('${h(p.id)}',false)">✕</button>`}</div>
                        <div class="mr-5 mt-1.5 space-y-1">${ts.map(t => treeTask(t, ro)).join('') || '<p class="text-[11px] text-slate-500">אין עדיין משימות להבטחה (אפשר להוסיף בדף ההבטחות).</p>'}</div></div>`; }).join('') || '<p class="text-xs text-slate-500">אין הבטחות מקושרות.</p>'}
                    ${ro ? '' : `<div class="flex gap-2"><select id="addP" class="g-inp flex-1" style="margin:0"><option value="">קשר הבטחה לסוגיה…</option>${cand.map(p => `<option value="${h(p.id)}">${h(p.text.slice(0, 60))} (${h(p.month)})</option>`).join('')}</select><button class="g-btn" onclick="if($('addP').value)linkP($('addP').value,true)">קשר</button></div>`}
                    <div class="rounded-xl border border-slate-700 bg-slate-900/40 p-2"><div class="text-xs font-bold text-slate-300 mb-1.5">☑️ משימות ישירות של הסוגיה (בלי הבטחה)</div><div class="space-y-1">${direct.map(t => treeTask(t, ro)).join('') || '<p class="text-[11px] text-slate-500">אין.</p>'}</div>
                    ${ro ? '' : `<div class="flex flex-wrap gap-2 mt-2"><input id="tk" class="g-inp flex-1 min-w-[10rem]" style="margin:0" maxlength="200" placeholder="משימה חדשה לטיפול בסוגיה…" onkeydown="if(event.key==='Enter')addT()"><input id="td" type="date" class="g-inp" style="margin:0;width:auto"><button class="g-btn" onclick="addT()">הוסף</button></div>`}</div></div></div>
                ${drp ? GOV_REV.html('issue', i.id) : ''}
                ${ro ? '' : `<div class="rounded-xl border border-violet-500/40 bg-violet-500/5 p-3 space-y-2"><h3 class="font-bold text-violet-300 text-sm">🚫 ביטול הסוגיה בנימוק</h3><label class="g-lab">למה מבטלים ולא סוגרים? (לפחות 10 תווים)<textarea id="dN" rows="2" maxlength="400" class="g-inp"></textarea></label><button class="g-btn" onclick="dropI()">בטל סוגיה</button><p class="text-[10px] text-slate-500">ביטול אינו מחיקה: הסוגיה נשמרת בהיסטוריה, ואפשר להעריך אותה אחר כך (ראש הממשלה ו-AI) האם הביטול היה החלטה נכונה. מחיקה מיועדת רק לסוגיה שנפתחה בטעות.</p></div>`}
                ${ro ? '' : `<div class="rounded-xl border border-emerald-500/40 bg-emerald-500/5 p-3 space-y-2"><h3 class="font-bold text-emerald-300 text-sm">✅ ${dis ? 'סימון מיגור ההסחה' : 'סגירת הסוגיה'}</h3><label class="g-lab">מה טופל ואיך? (לפחות 10 תווים)<textarea id="rN" rows="3" maxlength="800" class="g-inp"></textarea></label><button class="g-btn ok" onclick="resolve()">סגור</button><p class="text-[10px] text-slate-500">אי אפשר לסגור כל עוד יש משימות פתוחות בסוגיה (כולל משימות של הבטחות מקושרות). סוגיה שנסגרה נעולה ועוברת להיסטוריה.</p></div>`}
            </div>`;
        }
        function saveI() { const i = G.issues.get(sel); if (!i) return; if ($('eT').value.trim().length < 3) { alert('הסוגיה קצרה מדי.'); return; } i.title = $('eT').value; i.severity = $('eS').value; i.pid = $('eP').value; i.detail = $('eD').value; i.horizon = $('eH').value; i.target = $('eTd') ? $('eTd').value : ''; if (!G.issues.save(i)) { alert('תאריך יעד חייב להיות אחרי תאריך יצירת הסוגיה.'); return; } render(); }
        function setSt(st) { saveI(); G.issues.setStatus(sel, st); render(); }
        function linkP(pid, on) { G.issues.link(sel, pid, on); render(); }
        function addT() { const t = $('tk').value.trim(); if (t.length < 2) { alert('נסח את המשימה (לפחות 2 תווים).'); return; } const i = G.issues.get(sel); G.tasks.save({ text: t, issueId: sel, pid: i.pid, due: $('td').value }); render(); }
        function togT(id) { G.tasks.toggle(id); render(); }
        function delT(id) { if (confirm('למחוק את המשימה?')) { G.tasks.remove(id); render(); } }
        function resolve() { const r = G.issues.resolve(sel, $('rN').value); if (!r.ok) { alert(r.error); return; } render(); }
        function dropI() { const r = G.issues.drop(sel, $('dN').value); if (!r.ok) { alert(r.error); return; } showResolved = true; render(); }
        function delI() { if (confirm('למחוק את הסוגיה לגמרי? מחיקה היא הדרך היחידה שבה סוגיה לא נשמרת בהיסטוריה, ומיועדת לסוגיה שנפתחה בטעות. אם הסוגיה כבר לא רלוונטית, עדיף לבטל אותה בנימוק. (משימות מקושרות יישארו ללא סוגיה)')) { G.issues.remove(sel); sel = null; history.replaceState(null, '', location.pathname); render(); } }
        function render() { renderList(); renderDetail(); }
        window.addEventListener('DOMContentLoaded', render); window.addEventListener('storage', render);
    </script>
</body>
</html>
