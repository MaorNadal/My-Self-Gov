<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוגיות - ממשל אישי</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Rubik', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
    <script src="gov-core.js"></script>
    <script src="gov-nav.js"></script>
    <header class="max-w-6xl mx-auto px-4 pt-6 pb-2 text-center">
        <h1 class="text-3xl font-black text-white">🔥 סוגיות על הפרק</h1>
        <p class="text-slate-400 text-sm mt-1 max-w-2xl mx-auto">סוגיה עולה על הפרק, מסומנת לפי חומרה, מקושרת להבטחות ולמשימות שמטפלות בה, ונסגרת רק בתיעוד מה טופל ואיך, ורק אחרי שהמשימות המקושרות הושלמו.</p>
    </header>
    <main class="max-w-6xl mx-auto px-4 mt-4 grid grid-cols-1 lg:grid-cols-5 gap-4">
        <section id="iss-list" class="lg:col-span-2 space-y-3">
            <div class="g-card"><h2 class="font-bold text-white text-sm mb-2">➕ סוגיה חדשה</h2>
                <input id="nTitle" class="g-inp" maxlength="200" placeholder="מה הסוגיה?">
                <div class="grid grid-cols-2 gap-2 mt-2"><select id="nSev" class="g-inp" style="margin:0"><option value="3">🔴 חמורה</option><option value="2" selected>🟠 רגילה</option><option value="1">🟡 קלה</option></select><select id="nPid" class="g-inp" style="margin:0"></select></div>
                <button class="g-btn pri mt-2" onclick="addIssue()">הוסף</button></div>
            <div id="list" class="space-y-1.5"></div>
        </section>
        <section id="iss-detail" class="lg:col-span-3"></section>
    </main>
    <script>
        const G = window.GOV, h = G.esc, $ = id => document.getElementById(id), NOW = G.localDate(), MK = G.monthOf(NOW);
        let sel = (location.hash.match(/^#i=(.+)$/) || [])[1] || null, showResolved = false;
        const sevI = { 3: '🔴', 2: '🟠', 1: '🟡' };
        const pOpts = s => '<option value="">ללא תיק</option>' + G.portfolios.all().map(p => `<option value="${h(p.id)}"${p.id === s ? ' selected' : ''}>${p.icon} ${h(p.name)}</option>`).join('');
        function renderList() {
            $('nPid').innerHTML = pOpts('');
            const all = G.issues.all().sort((a, b) => b.severity - a.severity || a.created.localeCompare(b.created)), act = all.filter(i => i.status !== 'resolved'), res = all.filter(i => i.status === 'resolved');
            const row = i => { const s = G.ISSUE_STATUS[i.status], nT = G.tasks.forIssue(i.id), d = nT.filter(t => t.done).length;
                return `<button type="button" onclick="openI('${h(i.id)}')" class="w-full text-right g-card hover:border-amber-400 transition ${sel === i.id ? 'border-amber-400' : ''}" style="padding:10px"><div class="flex items-center gap-2 text-sm"><span>${sevI[i.severity]}</span><span class="flex-1 font-bold ${i.status === 'resolved' ? 'line-through text-slate-500' : 'text-white'}">${h(i.title)}</span><span class="g-chip" style="color:${s.c};border-color:${s.c}55">${s.l}</span></div>
                <div class="text-[10px] text-slate-500 mt-1">${(G.portfolios.get(i.pid) || { icon: '📁', name: 'ללא תיק' }).icon} • ${i.promiseIds.length} הבטחות • משימות ${d}/${nT.length}</div></button>`; };
            $('list').innerHTML = (act.map(row).join('') || '<p class="text-xs text-slate-500 text-center">אין סוגיות פתוחות.</p>') + (res.length ? `<button class="text-[11px] text-sky-300 underline" onclick="showResolved=!showResolved;render()">${showResolved ? 'הסתר' : 'הצג'} סוגיות שנסגרו (${res.length})</button>${showResolved ? res.map(row).join('') : ''}` : '');
        }
        function addIssue() { const t = $('nTitle').value.trim(); if (t.length < 3) { alert('נסח את הסוגיה (לפחות 3 תווים).'); return; } const i = G.issues.save({ title: t, severity: $('nSev').value, pid: $('nPid').value }); $('nTitle').value = ''; if (i) openI(i.id); }
        function openI(id) { sel = id; history.replaceState(null, '', '#i=' + id); render(); if (innerWidth < 1024) $('iss-detail').scrollIntoView({ behavior: 'smooth' }); }
        function renderDetail() {
            const i = sel && G.issues.get(sel), box = $('iss-detail');
            if (!i) { box.innerHTML = '<div class="g-card text-center text-sm text-slate-400">בחר סוגיה כדי לקשר לה הבטחות ומשימות, או הוסף סוגיה חדשה.</div>'; return; }
            const s = G.ISSUE_STATUS[i.status], ro = i.status === 'resolved', ts = G.tasks.forIssue(i.id).sort((a, b) => Number(a.done) - Number(b.done) || (a.due || '9').localeCompare(b.due || '9'));
            const cand = G.promises.all().filter(p => p.status !== 'dropped' && (p.month >= G.addMonths(MK, -1) || i.promiseIds.includes(p.id)) && (!['done', 'failed'].includes(p.status) || i.promiseIds.includes(p.id))).sort((a, b) => b.month.localeCompare(a.month));
            box.innerHTML = `<div class="g-card space-y-4" style="border-right:4px solid ${s.c}">
                <div class="flex flex-wrap items-center justify-between gap-2"><span class="g-chip" style="color:${s.c};border-color:${s.c}55;background:${s.c}1a">${s.l}</span><span class="text-[11px] text-slate-500">עלתה ${h(i.created)}${i.resolvedAt ? ' • נסגרה ' + h(i.resolvedAt) : ''}</span></div>
                ${ro ? `<h2 class="text-xl font-black text-white">${sevI[i.severity]} ${h(i.title)}</h2>${i.detail ? `<p class="text-sm text-slate-300">${h(i.detail)}</p>` : ''}<div class="text-sm text-emerald-200 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3">✅ ${h(i.note)}</div>` :
                `<div class="grid grid-cols-1 md:grid-cols-3 gap-3"><label class="g-lab md:col-span-3">הסוגיה<input id="eT" class="g-inp" maxlength="200" value="${h(i.title)}"></label>
                    <label class="g-lab">חומרה<select id="eS" class="g-inp">${[3, 2, 1].map(n => `<option value="${n}"${i.severity === n ? ' selected' : ''}>${sevI[n]} ${['', 'קלה', 'רגילה', 'חמורה'][n]}</option>`).join('')}</select></label>
                    <label class="g-lab md:col-span-2">תיק<select id="eP" class="g-inp">${pOpts(i.pid)}</select></label>
                    <label class="g-lab md:col-span-3">פירוט: מה בדיוק הבעיה, ומה ההשלכות אם לא תטופל?<textarea id="eD" rows="2" maxlength="600" class="g-inp">${h(i.detail)}</textarea></label></div>
                <div class="flex flex-wrap gap-2"><button class="g-btn pri" onclick="saveI()">💾 שמור</button>${i.status === 'open' ? '<button class="g-btn" onclick="setSt(\'handling\')">▶️ התחלתי לטפל</button>' : '<button class="g-btn" onclick="setSt(\'open\')">⏸️ החזר ל"עומדת על הפרק"</button>'}<button class="g-btn red" onclick="delI()">🗑️ מחק</button></div>`}
                <div><h3 class="font-bold text-white text-sm mb-2">📜 הבטחות שמטפלות בסוגיה (${i.promiseIds.length})</h3><div class="space-y-1">${cand.map(p => `<label class="flex items-center gap-2 text-xs bg-slate-900/70 border border-slate-700 rounded-lg px-2.5 py-1.5 ${ro ? '' : 'cursor-pointer'}"><input type="checkbox" ${i.promiseIds.includes(p.id) ? 'checked' : ''} ${ro ? 'disabled' : ''} onchange="linkP('${h(p.id)}',this.checked)" class="accent-amber-400"><span class="flex-1">${h(p.text)}</span><span style="color:${G.STATUS[p.status].c}">${G.STATUS[p.status].l} ${p.progress}%</span><span class="text-slate-500">${h(p.month)}</span></label>`).join('') || '<p class="text-xs text-slate-500">אין הבטחות פעילות לקישור. הוסף הבטחה בדף ההבטחות.</p>'}</div></div>
                <div><h3 class="font-bold text-white text-sm mb-2">☑️ משימות לטיפול בסוגיה (${ts.filter(t => t.done).length}/${ts.length})</h3><div class="space-y-1">${ts.map(t => { const od = !t.done && t.due && t.due < NOW; return `<div class="flex items-center gap-2 text-xs bg-slate-900/70 border border-slate-700 rounded-lg px-2.5 py-1.5"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="togT('${h(t.id)}')" class="w-4 h-4 accent-emerald-400"><span class="flex-1 ${t.done ? 'line-through text-slate-500' : ''}">${h(t.text)}</span>${t.due ? `<span style="color:${od ? '#f87171' : '#94a3b8'}">${h(t.due)}</span>` : ''}${ro ? '' : `<button class="text-rose-400" onclick="delT('${h(t.id)}')">✕</button>`}</div>`; }).join('') || '<p class="text-xs text-slate-500">אין משימות.</p>'}</div>
                    ${ro ? '' : `<div class="flex flex-wrap gap-2 mt-2"><input id="tk" class="g-inp flex-1 min-w-[10rem]" style="margin:0" maxlength="200" placeholder="משימה חדשה לטיפול בסוגיה…" onkeydown="if(event.key==='Enter')addT()"><input id="td" type="date" class="g-inp" style="margin:0;width:auto"><button class="g-btn" onclick="addT()">הוסף</button></div>`}</div>
                ${ro ? '' : `<div class="rounded-xl border border-emerald-500/40 bg-emerald-500/5 p-3 space-y-2"><h3 class="font-bold text-emerald-300 text-sm">✅ סגירת הסוגיה</h3><label class="g-lab">מה טופל ואיך? (לפחות 10 תווים)<textarea id="rN" rows="2" maxlength="400" class="g-inp"></textarea></label><button class="g-btn ok" onclick="resolve()">סגור סוגיה</button><p class="text-[10px] text-slate-500">אי אפשר לסגור כל עוד יש משימות פתוחות מקושרות. סוגיה שנסגרה נעולה.</p></div>`}
            </div>`;
        }
        function saveI() { const i = G.issues.get(sel); if (!i) return; if ($('eT').value.trim().length < 3) { alert('הסוגיה קצרה מדי.'); return; } i.title = $('eT').value; i.severity = $('eS').value; i.pid = $('eP').value; i.detail = $('eD').value; G.issues.save(i); render(); }
        function setSt(st) { saveI(); G.issues.setStatus(sel, st); render(); }
        function linkP(pid, on) { G.issues.link(sel, pid, on); render(); }
        function addT() { const t = $('tk').value.trim(); if (t.length < 2) { alert('נסח את המשימה (לפחות 2 תווים).'); return; } const i = G.issues.get(sel); G.tasks.save({ text: t, issueId: sel, pid: i.pid, due: $('td').value }); render(); }
        function togT(id) { G.tasks.toggle(id); render(); }
        function delT(id) { if (confirm('למחוק את המשימה?')) { G.tasks.remove(id); render(); } }
        function resolve() { const r = G.issues.resolve(sel, $('rN').value); if (!r.ok) { alert(r.error); return; } render(); }
        function delI() { if (confirm('למחוק את הסוגיה? (משימות מקושרות יישארו ללא סוגיה)')) { G.issues.remove(sel); sel = null; history.replaceState(null, '', location.pathname); render(); } }
        function render() { renderList(); renderDetail(); }
        window.addEventListener('DOMContentLoaded', render); window.addEventListener('storage', render);
    </script>
</body>
</html>
