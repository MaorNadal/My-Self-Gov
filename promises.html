<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הבטחות - ממשל אישי</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Rubik', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
    <script src="gov-core.js?v=0.14.2"></script>
    <script src="gov-nav.js?v=0.14.2"></script>

    <header class="max-w-6xl mx-auto px-4 pt-6 pb-2 text-center">
        <h1 class="text-3xl font-black text-white">📜 הבטחות הממשלה</h1>
        <p class="text-slate-400 text-sm mt-1 max-w-2xl mx-auto">הבטחה טובה ניתנת למדידה, יש לה עדיפות, ויש לה תיק שאחראי עליה. בסוף החודש הממשלה נמדדת רק לפי מה שהובטח כאן.</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 space-y-5 mt-4">
        <div class="flex items-center justify-center gap-3">
            <button class="g-btn" onclick="shift(-1)">→</button>
            <div class="text-center"><div id="monthLabel" class="text-xl font-black text-amber-400"></div><button class="text-[11px] text-slate-400 hover:text-slate-200 underline" onclick="goNow()">חזרה לחודש הנוכחי</button></div>
            <button class="g-btn" onclick="shift(1)">←</button>
        </div>
        <div id="banner"></div>
        <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

        <section id="promises-add" class="g-card"></section>
        <section id="promises-list" class="space-y-3"></section>
    </main>

    <script>
        const G = window.GOV, h = G.esc, $ = id => document.getElementById(id);
        const NOW = G.localDate(), NOW_MK = G.monthOf(NOW);
        let mk = NOW_MK;
        const closed = () => G.review.isClosed(mk);
        const pById = id => G.portfolios.all().find(p => p.id === id);
        const pOpts = () => '<option value="">ללא תיק</option>' + G.portfolios.all().map(p => `<option value="${h(p.id)}">${p.icon} ${h(p.name)}</option>`).join('');
        const bar = (pct, color) => `<div class="g-bar"><i style="width:${pct}%;background:${color}"></i></div>`;
        function shift(n) { mk = G.addMonths(mk, n); render(); }
        function goNow() { mk = NOW_MK; render(); }

        function renderTop() {
            $('monthLabel').textContent = G.monthLabel(mk);
            const cl = closed(), past = mk < NOW_MK;
            $('banner').innerHTML = cl ? '<div class="border border-violet-500/30 bg-violet-500/10 text-violet-100 rounded-xl px-3 py-2 text-xs text-center">🔒 החודש הזה נסגר והוקפא. אפשר לראות את ההבטחות, אבל לא לשנות אותן (כדי שאי אפשר יהיה לשכתב היסטוריה). פתיחה מחדש אפשרית בדף "ציון חודשי".</div>'
                : (past ? '<div class="border border-amber-500/30 bg-amber-500/10 text-amber-100 rounded-xl px-3 py-2 text-xs text-center">חודש שעבר: אפשר לעדכן ביצוע, אבל לא להוסיף הבטחות רטרואקטיבית. סגור אותו בדף "ציון חודשי".</div>' : '');
            const sc = G.score(mk), g = sc.total != null ? G.gradeFor(sc.total) : null;
            const card = (v, l, c) => `<div class="g-card text-center" style="padding:10px"><div class="text-2xl font-black" style="color:${c}">${v}</div><div class="text-[11px] text-slate-400">${l}</div></div>`;
            $('summary').innerHTML = card(sc.promisesN, 'הבטחות פעילות', '#fbbf24') + card(sc.doneN, 'בוצעו', '#34d399') + card(sc.droppedN, 'הוסרו בנימוק', '#a78bfa') + card(g ? g.l : '—', g ? 'ציון עד כה (' + sc.total + ')' : 'אין מספיק נתונים לציון', g ? g.c : '#64748b');
        }

        function renderAdd() {
            const box = $('promises-add');
            if (closed() || mk < NOW_MK) { box.innerHTML = '<p class="text-xs text-slate-500 text-center">הוספת הבטחות אפשרית רק בחודש הנוכחי או בחודשים עתידיים שלא נסגרו.</p>'; return; }
            const prev = G.addMonths(mk, -1), carry = G.promises.all().filter(p => p.month === prev && ['open', 'progress', 'failed'].includes(p.status)).length;
            box.innerHTML = `<h2 class="font-bold text-white text-sm mb-3">➕ הבטחה חדשה ל${h(G.monthLabel(mk))}</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <label class="g-lab md:col-span-2">ההבטחה (לפחות 5 תווים, בניסוח שאפשר לבדוק)<input id="fText" class="g-inp" maxlength="300" placeholder="למשל: 12 אימונים החודש"></label>
                    <label class="g-lab">תיק אחראי<select id="fPid" class="g-inp">${pOpts()}</select></label>
                    <label class="g-lab">עדיפות<select id="fPri" class="g-inp"><option value="3">מכרעת</option><option value="2" selected>רגילה</option><option value="1">נמוכה</option></select></label>
                    <label class="g-lab md:col-span-2">איך נדע שבוצעה? (תיאור חופשי)<input id="fMeasure" class="g-inp" maxlength="300"></label>
                    <div class="md:col-span-4 rounded-xl border border-dashed border-slate-600 p-2.5"><div class="text-[11px] font-bold text-slate-300 mb-1.5">🎯 קריטריון הצלחה מובנה (אופציונלי): ההתקדמות תחושב ממנו</div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 items-end"><label class="g-lab">סוג<select id="fCt" class="g-inp" onchange="critForm()"><option value="none">ללא (ידני / משימות)</option><option value="count">ספירה מול יעד (למשל 10 ספרים)</option><option value="recurring">חזרתיות (למשל כל 21 יום)</option></select></label>
                            <label class="g-lab" id="fCnW" style="display:none">יעד (מספר)<input id="fCn" type="number" min="1" class="g-inp" value="10"></label><label class="g-lab" id="fCuW" style="display:none">יחידה<input id="fCu" class="g-inp" maxlength="20" placeholder="ספרים"></label>
                            <label class="g-lab" id="fCeW" style="display:none">כל כמה ימים<input id="fCe" type="number" min="1" max="365" class="g-inp" value="21"></label></div></div>
                    <label class="g-lab md:col-span-2">למה זה חשוב? (אופציונלי)<input id="fWhy" class="g-inp" maxlength="300"></label>
                </div>
                <div class="flex flex-wrap gap-2 mt-3"><button class="g-btn pri" onclick="addPromise()">הוסף הבטחה</button>
                    ${carry ? `<button class="g-btn" onclick="carryOver()">🔁 גלגל ${carry} הבטחות שלא בוצעו מ${h(G.monthLabel(prev))}</button>` : ''}</div>
                <p class="text-[10px] text-slate-500 mt-2">הבטחות מגולגלות מסומנות 🔁 ומתחילות מאפס. הסימון נשאר, כדי שיהיה ברור כמה זמן הבטחה נגררת.</p>`;
        }
        function critForm() { const t = $('fCt').value; $('fCnW').style.display = $('fCuW').style.display = t === 'count' ? '' : 'none'; $('fCeW').style.display = t === 'recurring' ? '' : 'none'; }
        function critBlock(p, ro) {
            const c = G.critStatus(p); if (!c) return '';
            if (c.type === 'count') return `<div class="mt-2 bg-slate-900/60 border border-slate-700 rounded-lg p-2"><div class="flex justify-between text-[11px] text-slate-300"><span>📏 ספירה: <b>${c.total}</b> מתוך <b>${c.target}</b> ${h(c.unit)}${c.base ? `<span class="text-slate-400"> • מתוכם ${c.base} מחודשים קודמים ו-<b class="text-emerald-300">${c.month}</b> החודש</span>` : ''}</span><span class="flex-none">${G.gauge(c.pct, { size: 44 })}</span></div><div class="g-bar mt-1"><i style="width:${c.pct}%;background:#34d399"></i></div>
                ${ro || ['done', 'failed', 'dropped'].includes(p.status) ? '' : `<div class="flex gap-2 mt-2"><input id="cv_${h(p.id)}" type="number" min="1" value="1" class="g-inp" style="margin:0;width:5rem"><button class="g-btn ok" onclick="logC('${h(p.id)}')">➕ הוסף ${h(c.unit)}</button><button class="g-btn" onclick="undoC('${h(p.id)}')">↩️ בטל אחרון</button></div>`}</div>`;
            return `<div class="mt-2 bg-slate-900/60 border border-slate-700 rounded-lg p-2"><div class="flex flex-wrap justify-between gap-2 text-[11px] text-slate-300"><span>🔁 כל ${c.every} ימים: בוצע <b>${c.done}</b> מתוך <b>${c.expected}</b> החודש</span><span class="flex-none">${G.gauge(c.pct, { size: 44 })}</span></div><div class="g-bar mt-1"><i style="width:${c.pct}%;background:#34d399"></i></div>
                <div class="text-[11px] mt-1 ${c.overdue ? 'text-rose-300' : 'text-slate-400'}">${c.last ? 'ביצוע אחרון: ' + h(c.last) + ' • ' : ''}${c.overdue ? 'באיחור! היה אמור להתבצע עד ' + h(c.next) : 'הביצוע הבא: ' + h(c.next)}</div>
                ${ro || ['done', 'failed', 'dropped'].includes(p.status) ? '' : `<div class="flex gap-2 mt-2"><button class="g-btn ok" onclick="logC('${h(p.id)}')">✅ סמן ביצוע היום</button><button class="g-btn" onclick="undoC('${h(p.id)}')">↩️ בטל אחרון</button></div>`}</div>`;
        }
        function logC(id) { const e = $('cv_' + id), r = G.promises.logCrit(id, e ? e.value : 1); if (!r.ok) alert(r.error); render(); }
        function undoC(id) { G.promises.undoCrit(id); render(); }
        function addPromise() {
            const t = $('fText').value.trim();
            if (t.length < 5) { alert('נסח את ההבטחה בלפחות 5 תווים.'); return; }
            G.promises.save({ month: mk, text: t, pid: $('fPid').value, priority: $('fPri').value, measure: $('fMeasure').value, why: $('fWhy').value, crit: { type: $('fCt').value, target: $('fCn').value, unit: $('fCu').value, every: $('fCe').value, log: [] } });
            render();
        }
        function carryOver() {
            const prev = G.addMonths(mk, -1), have = new Set(G.promises.all().filter(p => p.month === mk).map(p => p.text));
            let n = 0;
            G.promises.all().filter(p => p.month === prev && ['open', 'progress', 'failed'].includes(p.status) && !have.has(p.text)).forEach(p => { if (G.promises.carry(p.id, mk)) n++; });
            if (!n) alert('כל ההבטחות כבר קיימות החודש.'); render();
        }

        const openT = new Set();
        function taskBlock(p, ro) {
            const ts = G.tasks.forPromise(p.id).sort((a, b) => Number(a.done) - Number(b.done) || (a.due || '9').localeCompare(b.due || '9')), n = ts.filter(t => t.done).length, isO = openT.has(p.id) || (ts.length && ts.length > n && false);
            const allDone = ts.length && n === ts.length && p.status !== 'done' && p.status !== 'failed' && !ro;
            return `<div class="mt-3 border-t border-slate-700 pt-2"><button class="text-[11px] text-sky-300 underline" onclick="toggleT('${h(p.id)}')">${isO ? '▲' : '▼'} משימות (${n}/${ts.length})</button>
                ${allDone ? `<button class="g-btn ok mr-2" onclick="setStatus('${h(p.id)}','done')">✅ כל המשימות הושלמו: סמן הבטחה כבוצעה</button>` : ''}
                ${isO ? `<div class="mt-2 space-y-1">${ts.map(t => { const od = !t.done && t.due && t.due < NOW, is = t.issueId && G.issues.get(t.issueId); return `<div class="flex items-center gap-2 text-xs bg-slate-900/70 border border-slate-700 rounded-lg px-2.5 py-1.5"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="togT('${h(t.id)}')" class="w-4 h-4 accent-emerald-400"><span class="flex-1 ${t.done ? 'line-through text-slate-500' : ''}">${h(t.text)}${t.pid && t.pid !== p.pid && G.portfolios.get(t.pid) ? ' <span class="text-sky-300" title="תיק שונה מהבטחה">' + G.portfolios.get(t.pid).icon + '</span>' : ''}${is ? ' <span class="text-slate-500">🔥 ' + h(is.title.slice(0, 28)) + '</span>' : ''}</span>${t.time ? '<span class="text-sky-300" dir="ltr">' + h(t.time) + '</span>' : ''}${t.due ? `<span style="color:${od ? '#f87171' : '#94a3b8'}">${h(t.due)}${od ? ' (באיחור)' : ''}</span>` : ''}<button class="text-rose-400" onclick="delT('${h(t.id)}')">✕</button></div>`; }).join('') || '<p class="text-xs text-slate-500">אין משימות.</p>'}
                    ${p.status === 'done' || p.status === 'failed' || p.status === 'dropped' ? '' : `<div class="flex flex-wrap gap-2 mt-2"><input id="tk_${h(p.id)}" class="g-inp flex-1 min-w-[10rem]" style="margin:0" maxlength="200" placeholder="משימה חדשה להבטחה…" onkeydown="if(event.key==='Enter')addT('${h(p.id)}')"><input id="td_${h(p.id)}" type="date" class="g-inp" style="margin:0;width:auto"><input id="th_${h(p.id)}" type="time" class="g-inp" style="margin:0;width:auto"><select id="tp_${h(p.id)}" class="g-inp" style="margin:0;width:auto" title="תיק המשימה (ברירת מחדל: תיק ההבטחה)">${G.portfolios.all().map(x => `<option value="${h(x.id)}"${x.id === p.pid ? ' selected' : ''}>${x.icon} ${h(x.name)}</option>`).join('')}<option value=""${p.pid ? '' : ' selected'}>ללא תיק</option></select><button class="g-btn" onclick="addT('${h(p.id)}')">הוסף</button></div>`}</div>` : ''}</div>`;
        }
        function toggleT(id) { openT.has(id) ? openT.delete(id) : openT.add(id); render(); }
        function addT(pid) { const p = G.promises.get(pid), t = $('tk_' + pid).value.trim(); if (!p || t.length < 2) { alert('נסח את המשימה (לפחות 2 תווים).'); return; } openT.add(pid); G.tasks.save({ text: t, promiseId: pid, pid: $('tp_' + pid).value, due: $('td_' + pid).value, time: $('th_' + pid).value }); render(); }
        function togT(id) { G.tasks.toggle(id); render(); }
        function delT(id) { if (confirm('למחוק את המשימה?')) { G.tasks.remove(id); render(); } }
        function card(p) {
            const s = G.STATUS[p.status], port = pById(p.pid), ro = closed() || p.status === 'dropped';
            return `<div class="g-card" style="border-right:4px solid ${s.c};padding:14px">
                <div class="flex flex-wrap items-start justify-between gap-2"><div class="min-w-0"><div class="font-bold text-white">${p.carried ? '🔁 ' : ''}${p.priority === 3 ? '⭐ ' : ''}${h(p.text)}</div>
                    <div class="text-[11px] text-slate-400 mt-0.5">${port ? port.icon + ' ' + h(port.name) : 'ללא תיק'} • עדיפות ${G.PRIORITY[p.priority]}${p.doneAt ? ' • בוצעה ב-' + p.doneAt : ''}</div></div>
                    <span class="g-chip" style="color:${s.c};border-color:${s.c}55;background:${s.c}1a">${s.l}</span></div>
                ${p.measure ? `<div class="text-[11px] text-slate-300 mt-2">🎯 קריטריון: ${h(p.measure)}</div>` : ''}${critBlock(p, ro)}${p.why ? `<div class="text-[11px] text-slate-400">💭 ${h(p.why)}</div>` : ''}
                ${p.status === 'dropped' ? `<div class="text-[11px] text-violet-300 mt-2">נימוק להסרה${p.droppedAt ? ' (' + h(p.droppedAt) + ')' : ''}: ${G.nl(p.dropReason)}</div><div class="mt-2">${p.dropIssueId ? `<a href="issues.html#i=${h(p.dropIssueId)}" class="block text-xs rounded-xl border border-violet-500/40 bg-violet-500/5 p-3 text-violet-300 hover:border-amber-400">⚖️ בוטלה אוטומטית עם סוגיה. הנימוק וההערכה (ראש הממשלה ו-AI) נמצאים בדף הסוגיה ←</a>` : GOV_REV.html('promise', p.id)}</div>` : ''}
                ${p.status !== 'dropped' ? `<div class="flex items-center gap-3 mt-3">${G.gauge(p.progress, { size: 72, color: s.c, label: s.l })}<div class="flex-1 min-w-0">${bar(p.progress, s.c)}<div class="flex justify-between text-[10px] text-slate-500 mt-1"><span>0</span><span>50%</span><span>100%</span></div></div></div>` : ''}
                ${taskBlock(p, ro)}
                ${ro ? '' : `<div class="flex flex-wrap items-center gap-2 mt-3">
                    ${G.tasks.forPromise(p.id).length || p.crit.type !== 'none' ? '<span class="flex-1 text-[11px] text-slate-400">ההתקדמות מחושבת אוטומטית ' + (G.tasks.forPromise(p.id).length ? 'מהמשימות.' : 'מהקריטריון.') + '</span>' : `<input type="range min="0" max="100" step="5" value="${p.progress}" class="flex-1 min-w-[8rem] accent-amber-400" onchange="setProgress('${h(p.id)}',this.value)">`}
                    <select class="g-inp" style="margin:0;width:auto" onchange="setStatus('${h(p.id)}',this.value)">${['open', 'progress', 'done', 'failed'].map(k => `<option value="${k}"${p.status === k ? ' selected' : ''}>${G.STATUS[k].l}</option>`).join('')}</select>
                    <button class="g-btn" onclick="editText('${h(p.id)}')">✏️</button><button class="g-btn" onclick="dropPromise('${h(p.id)}')" title="הסרה דורשת נימוק">הסר בנימוק</button><button class="g-btn red" onclick="removePromise('${h(p.id)}')">🗑️</button></div>`}
            </div>`;
        }
        function renderList() {
            const all = G.promises.all().filter(p => p.month === mk).sort((a, b) => b.priority - a.priority || a.created.localeCompare(b.created));
            const groups = [['פעילות', all.filter(p => p.status === 'open' || p.status === 'progress')], ['בוצעו', all.filter(p => p.status === 'done')], ['לא בוצעו', all.filter(p => p.status === 'failed')], ['הוסרו בנימוק', all.filter(p => p.status === 'dropped')]];
            $('promises-list').innerHTML = all.length ? groups.filter(g => g[1].length).map(g => `<div><h3 class="text-sm font-bold text-slate-300 mb-2">${g[0]} (${g[1].length})</h3><div class="space-y-2">${g[1].map(card).join('')}</div></div>`).join('')
                : '<div class="g-card text-center text-sm text-slate-400">אין הבטחות לחודש הזה.</div>';
        }
        function mutate(id, fn) { if (closed()) return; const p = G.promises.get(id); if (!p) return; fn(p); G.promises.save(p); render(); }
        function setProgress(id, v) { mutate(id, p => { p.progress = Number(v); if (p.progress === 100) { p.status = 'done'; p.doneAt = NOW; } else if (p.progress > 0 && (p.status === 'open' || p.status === 'done')) { p.status = 'progress'; p.doneAt = ''; } else if (p.progress === 0 && p.status === 'progress') p.status = 'open'; }); }
        function setStatus(id, s) { if (s === 'done' && G.tasks.forPromise(id).some(t => !t.done)) { alert('יש משימות פתוחות בהבטחה. השלם אותן, או מחק אותן אם הן כבר לא רלוונטיות.'); render(); return; } mutate(id, p => { p.status = s; if (s === 'done') { p.progress = 100; p.doneAt = NOW; } else p.doneAt = ''; }); }
        function editText(id) { const p = G.promises.get(id); if (!p) return; const t = prompt('נוסח ההבטחה:', p.text); if (t && t.trim().length >= 5) mutate(id, x => { x.text = t.trim(); }); }
        function dropPromise(id) {   // טופס ביטול מוקשח בחלון: סיבה + נימוק 40 תווים + תצוגה מקדימה (GOV_REV.dropForm)
            closeDrop(); const m = document.createElement('div'); m.id = 'dropModal'; m.style.cssText = 'position:fixed;inset:0;z-index:900;background:#020617cc;display:flex;align-items:center;justify-content:center;padding:14px';
            m.innerHTML = '<div class="g-card" style="max-width:460px;width:100%;background:#0f172a"><div class="flex justify-between items-center mb-2"><b class="text-white text-sm">הסרת הבטחה</b><button class="g-btn" onclick="closeDrop()">✕</button></div>' + GOV_REV.dropForm('promise', id) + '</div>';
            m.addEventListener('click', e => { if (e.target === m) closeDrop(); }); document.body.appendChild(m);
        }
        function closeDrop() { const m = document.getElementById('dropModal'); if (m) m.remove(); }
        function removePromise(id) { if (closed()) return; if (confirm('למחוק את ההבטחה לגמרי? (אם היא פשוט לא בוצעה, עדיף לסמן "לא בוצעה" ולא למחוק)')) { G.promises.remove(id); render(); } }

        function render() { closeDrop(); renderTop(); renderAdd(); renderList(); }
        window.addEventListener('DOMContentLoaded', render);
        window.addEventListener('storage', render);
    </script>
</body>
</html>
